<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a122a" />
    <meta
      name="description"
      content="Oqerun Office Suite — Writer, Sheets and Slides in one open-source application."
    />
    <title>Oqerun Office Suite</title>
    <style>
      html,
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #07101f;
      }

      body {
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        box-sizing: border-box;
        color: #eaf0ff;
        background:
          radial-gradient(circle at 20% 10%, rgba(74, 112, 255, 0.18), transparent 34%),
          radial-gradient(circle at 85% 80%, rgba(104, 66, 255, 0.12), transparent 30%),
          #07101f;
        font: 16px/1.5 system-ui, sans-serif;
      }

      .boot-card {
        width: min(520px, 100%);
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background: rgba(18, 31, 55, 0.82);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }

      .boot-brand {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 800;
      }

      .boot-text {
        margin: 0;
        color: #9aa8c2;
      }

      .boot-error {
        margin-top: 18px;
        padding: 14px;
        border-radius: 10px;
        color: #ffd6d6;
        background: rgba(160, 40, 40, 0.18);
        border: 1px solid rgba(255, 120, 120, 0.2);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot-screen" aria-live="polite">
        <section class="boot-card">
          <h1 class="boot-brand">Oqerun Office</h1>
          <p class="boot-text">Starting Office Suite…</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
